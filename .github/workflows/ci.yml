name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Build unmodified Git LFS reference server
        run: |
          git lfs version
          go install github.com/git-lfs/lfs-test-server@d27ad23fddc1949ecd9a4ba6a3d074bc6a567084
          echo "GIT_CDC_LFS_TEST_SERVER=$(go env GOPATH)/bin/lfs-test-server" >> "$GITHUB_ENV"
          echo "GIT_CDC_LFS_REFERENCE_SERVER=$(go env GOPATH)/bin/lfs-test-server" >> "$GITHUB_ENV"
      - name: Test
        run: env -u GIT_CDC_LFS_TEST_SERVER cargo test --workspace --locked
      - name: HTTP LFS reference-server workflows
        run: cargo test -p git-cdc-cli --test lfs --locked -- --include-ignored
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all --check
